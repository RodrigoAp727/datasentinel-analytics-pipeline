name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests main.py streamlit_app.py

      - name: Run tests with coverage >= 80%
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Build Docker image
        run: docker build -t datasentinel:ci .
